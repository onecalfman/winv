name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell jq unzip shellcheck

      - name: Lint shell scripts
        run: shellcheck install.sh tests/validate.sh

      - name: Validate source
        run: ./tests/validate.sh

      - name: Build extension bundle
        run: |
          mkdir -p dist
          gnome-extensions pack . --force --out-dir dist
          test -s "dist/winv@onecalfman.shell-extension.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/winv@onecalfman.shell-extension.zip" \
            --title "WinV $GITHUB_REF_NAME" \
            --generate-notes

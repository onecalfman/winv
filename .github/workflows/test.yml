name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Node-version validation
        run: ./tests/validate.sh javascript

  package:
    name: Validate extension packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install validation tools once
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell jq unzip shellcheck

      - name: Lint shell scripts
        run: shellcheck install.sh tests/validate.sh

      - name: Run validation
        run: ./tests/validate.sh package
